[package]
name = "quickrapidx"
version = "0.5.0"
description = "QuickRapidX"
authors = ["Good_Fox"]
license = "MIT"
edition = "2021"

[lib]
# Суффикс `_lib` нужен, чтобы имя библиотеки не столкнулось с именем бинарника
# на Windows. См. https://github.com/rust-lang/cargo/issues/8519
name = "quickrapidx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
# Сводка о системе для стартовой страницы
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tauri-plugin-dialog = "2.7.2"
# Значки уходят в интерфейс готовой картинкой. Сырые пиксели пришлось бы
# сериализовать как массив чисел: на списке в несколько сотен программ это
# десятки мегабайт JSON, и разбор их держит главный поток окна.
png = "0.17"
base64 = "0.22"
# Перетаскивание файла из окна наружу — на панель задач или рабочий стол.
# Своими силами это COM: нужно построить IDataObject и IDropSource и отдать их
# DoDragDrop. Через windows-sys, где реализации интерфейсов нет, это сотни строк
# ручных таблиц методов — тот случай, когда чужая проверенная обёртка честнее.
tauri-plugin-drag = "2.1.1"

# Сон скрытых окон: усыпление и пробуждение WebView2.
#
# Версии совпадают с теми, что тянет сама Tauri, — иначе типы интерфейсов не
# сойдутся: `PlatformWebview::controller()` отдаёт `ICoreWebView2Controller`
# именно из этой сборки, и чужая была бы другим типом с тем же именем.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# Подробнее об оптимизации размера: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
